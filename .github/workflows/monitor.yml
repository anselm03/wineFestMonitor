name: Montmartre-Vignes Reservierungs-Monitor

on:
  # HINWEIS: Der frühere "schedule"-Trigger von GitHub selbst wurde
  # bewusst ENTFERNT (siehe README). GitHub garantiert bei schedule-
  # Events keine Pünktlichkeit - Verzögerungen von mehreren Minuten
  # bis über einer Stunde sind laut GitHub-Doku möglich, ganze Läufe
  # können sogar ausfallen. Stattdessen triggert jetzt ein externer
  # Dienst (cron-job.org) diesen Workflow zuverlässiger von außen über
  # die GitHub-API (workflow_dispatch, siehe README-Abschnitt
  # "Externer Trigger via cron-job.org").
  #
  # workflow_dispatch bleibt erhalten für:
  #   a) den externen Trigger von cron-job.org,
  #   b) manuelles Auslösen über den "Run workflow"-Button zum Testen.
  workflow_dispatch: {}

# Nötig, damit dieser Workflow den aktualisierten Status-Verlauf
# (data/historique_statuts.jsonl) per "git push" zurück ins Repo
# schreiben darf.
permissions:
  contents: write

# Verhindert, dass sich zwei Läufe überlappen und sich beim Zurück-
# Committen der Historie gegenseitig in die Quere kommen. Statt einen
# laufenden Job abzubrechen (cancel-in-progress: true), wird ein
# überlappender Lauf hier in die Warteschlange gestellt, damit keine
# Prüfung verloren geht.
concurrency:
  group: montmartre-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Prüflauf ausführen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Aktualisierten Status-Verlauf zurück ins Repo committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historique_statuts.jsonl
          if git diff --cached --quiet; then
            echo "Keine Änderungen an der Historie, kein Commit nötig."
          else
            git commit -m "chore: Status-Verlauf aktualisiert [skip ci]"
            git push
          fi
